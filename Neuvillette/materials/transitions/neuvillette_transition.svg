  <path d="M621 259 C705 128 827 25 958 -39" fill="none" stroke="#818181" stroke-width="19" stroke-linecap="round"/>
  <path d="M2057 1044 C1940 1190 1788 1294 1611 1365" fill="none" stroke="#5e5e5e" stroke-width="22" stroke-linecap="round"/>
</svg>
