  <path d="M1314 -674 C1882 -693 2360 -296 2446 266 C2537 845 2202 1369 1651 1575 C1082 1784 472 1551 229 1021 C-19 474 188 -135 696 -433 C885 -546 1092 -666 1314 -674Z"
        fill="none" stroke="#484848" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Broken secondary fronts make the circular waves feel hand-drawn and alive. -->
  <path d="M1191 434 C1236 413 1288 408 1337 419" fill="none" stroke="#f8f8f8" stroke-width="10" stroke-linecap="round"/>
  <path d="M1510 430 C1543 476 1556 526 1558 572" fill="none" stroke="#dfdfdf" stroke-width="13" stroke-linecap="round"/>
